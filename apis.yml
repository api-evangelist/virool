name: Virool
description: >-
  Virool is a native video advertising platform that distributes branded video
  content ("advertainment") across the web to help brands reach and grow
  targeted audiences. It pairs a proprietary data-management platform of roughly
  450 million unique profiles for granular audience targeting with native video
  placement technology designed to minimize disruption to the user experience,
  and a real-time performance analytics dashboard that includes emotional
  insight tracking (eIQ). Virool serves advertisers and publishers through
  self-service campaign and monetization dashboards rather than a public
  developer API. The company was backed by 500 Global and a16z and has run
  campaigns for brands including Turkish Airlines, Under Armour, and WestJet.
