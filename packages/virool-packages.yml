  note: >-
    Virool publishes NO first-party API client library in any registry. The three npm
    packages carrying a "virool-" name prefix were published in April/June 2016 from
    PERSONAL npm accounts (kastsiushkin, vladtsf), not an organization scope, and none of
    them is a client for a Virool API — two are forks of unrelated third-party projects
    (Imply's Pivot for Druid.io, a Material Design React component kit) and the third is
    an internal inventory tool with no repository and no published interface. They are
    recorded here as measured evidence of abandonment, NOT as SDKs: no `SDKs` pointer is
    emitted in apis.yml, because emitting one would credit Virool with a client library it
    never shipped.
